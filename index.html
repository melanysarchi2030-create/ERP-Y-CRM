    function loadDatabase() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const init = getInitialDatabase();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(init));
          return init;
        }
        return JSON.parse(raw);
      } catch (e) {
        console.error('Error cargando DB:', e);
        return getInitialDatabase();
      }
    }

    function saveDatabase() {
      db.meta.lastSync = new Date().toISOString();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    }

    function loadSession() {
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function saveSession(userObj) {
      currentUser = userObj;
      if (userObj) {
        localStorage.setItem(SESSION_KEY, JSON.stringify(userObj));
      } else {
        localStorage.removeItem(SESSION_KEY);
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const id = 'toast-' + Date.now();
      const colors = {
        success: 'bg-emerald-900 text-white border-emerald-700',
        error: 'bg-avyra-burgundy text-white border-red-800',
        warning: 'bg-amber-800 text-white border-amber-600',
        info: 'bg-avyra-navy text-white border-avyra-navyLight'
      };
      const el = document.createElement('div');
      el.id = id;
      el.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg border text-sm font-medium fade-in ${colors[type] || colors.info}`;
      el.innerHTML = `
        <span class="flex-1">${message}</span>
        <button onclick="this.parentElement.remove()" class="opacity-70 hover:opacity-100">&times;</button>
      `;
      container.appendChild(el);
      setTimeout(() => {
        const target = document.getElementById(id);
        if (target) target.remove();
      }, 4200);
    }

      panel.className = `bg-white rounded-2xl shadow-2xl border border-avyra-border w-full ${maxWidthClass} overflow-hidden my-8 fade-in`;
      panel.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
      lucide.createIcons();
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    /**
     * ============================================================================
     * MOTOR DE INTEGRACIÓN TRANSACCIONAL (ERP <-> CRM <-> TIENDA VIRTUAL)
     * ============================================================================
     */
    function processIntegratedOrder({
      channel,
      customerData,
      items,
      paymentMethod,
      discountCode = '',
      initialStatus = 'Confirmado'
    }) {
      // 1. Validar stock disponible
      for (const item of items) {
        const prod = db.products.find(p => p.id === item.productId);
        if (!prod) throw new Error(`Producto no encontrado: ${item.name}`);
        if (prod.stock < item.qty) {
          throw new Error(`Stock insuficiente para ${prod.name} (Disponible: ${prod.stock}, Solicitado: ${item.qty})`);
        }
      }

      // 2. Sincronizar Cliente en CRM (Crear o Actualizar)
      let customer = db.customers.find(c => c.email.toLowerCase() === customerData.email.toLowerCase());
      const nowDate = todayStr();

      if (!customer) {
        customer = {
          id: 'CLI-' + String(db.customers.length + 1).padStart(3, '0'),
          firstName: customerData.firstName,
          lastName: customerData.lastName,
          email: customerData.email,
          phone: customerData.phone || '593990000000',
          address: customerData.address,
          city: customerData.city,
          province: customerData.province,
          registeredAt: nowDate,
          segment: 'Nuevo',
          preferences: items.map(i => i.name).join(', '),
          marketingConsent: Boolean(customerData.marketingConsent),
          interactions: [
            { date: nowDate, type: `Registro & Compra (${channel})`, note: 'Cliente incorporado automáticamente desde flujo de ventas.' }
          ]
        };
        db.customers.unshift(customer);
      } else {
        // Actualizar datos y clasificación automática
        customer.address = customerData.address || customer.address;
        customer.city = customerData.city || customer.city;
        customer.province = customerData.province || customer.province;
        customer.phone = customerData.phone || customer.phone;
        const pastOrdersCount = db.orders.filter(o => o.customerId === customer.id && o.status !== 'Cancelado').length;
        if (pastOrdersCount >= 2) customer.segment = 'Frecuente';
        else if (pastOrdersCount === 1) customer.segment = 'Recurrente';
        customer.interactions.unshift({
          date: nowDate,
          type: `Nueva Compra (${channel})`,
          note: `Realizó pedido con ${items.length} artículo(s).`
        });
      }

      // 3. Calcular totales y descuentos
      let rawSubtotal = items.reduce((acc, i) => acc + (i.price * i.qty), 0);
      let discountAmount = 0;
      if (discountCode) {
        const camp = db.campaigns.find(c => c.code.toUpperCase() === discountCode.trim().toUpperCase() && c.status === 'Activa');
        if (camp) {
          discountAmount = rawSubtotal * (camp.discountPct / 100);
          camp.conversions += 1;
        }
      }
      const subtotal = Math.max(0, rawSubtotal - discountAmount);
      const iva = Number((subtotal * db.meta.ivaRate).toFixed(2));
      const total = Number((subtotal + iva).toFixed(2));

      const orderId = 'ORD-2026-' + (101 + db.orders.length);

      // 4. Descontar Stock en Inventario y Registrar Kardex
      const stockLogs = [];
      items.forEach(item => {
        const prod = db.products.find(p => p.id === item.productId);
        const prevStock = prod.stock;
        prod.stock -= item.qty;
        stockLogs.push(`${prod.sku} (-${item.qty})`);
        db.inventoryMovements.unshift({
          id: 'MOV-' + (1001 + db.inventoryMovements.length),
          date: nowDate,
          sku: prod.sku,
          productName: prod.name,
          type: 'Salida por Venta',
          qty: -item.qty,
          prevStock,
          newStock: prod.stock,
          reference: orderId,
          user: currentUser ? currentUser.fullName : 'Tienda Online API'
        });
      });

      // 5. Crear Pedido en ERP + Orden Logística Ecuador
      const newOrder = {
        id: orderId,
        date: nowDate,
        channel,
        customerId: customer.id,
        customerName: `${customer.firstName} ${customer.lastName}`,
        customerEmail: customer.email,
        customerPhone: customer.phone,
        shippingAddress: customer.address,
        city: customer.city,
        province: customer.province,
        items: items.map(i => ({ ...i })),
        subtotal,
        discountAmount,
        discountCode: discountCode ? discountCode.toUpperCase() : '',
        iva,
        total,
        paymentMethod,
        status: initialStatus,
        logistics: {
          carrier: 'Servientrega Ecuador',
          tracking: 'SER-EC-' + Math.floor(1000000 + Math.random() * 9000000),
          dispatchStatus: 'En Preparación',
          updatedAt: nowDate
        }
      };
      db.orders.unshift(newOrder);

      // 6. Registrar Ingreso en Módulo Financiero (si no está cancelado)
      if (initialStatus !== 'Cancelado') {
        db.financeEntries.unshift({
          id: 'FIN-' + String(db.financeEntries.length + 1).padStart(3, '0'),
          date: nowDate,
          type: 'Ingreso',
          category: channel === 'Tienda Virtual' ? 'Ventas E-Commerce' : 'Ventas Directas ERP',
          description: `Venta ${orderId} - ${newOrder.customerName}`,
          amount: total,
          reference: orderId
        });
      }

      // 7. Registrar Evento en Monitor API / Webhook
      const webhookEvent = {
        id: 'WH-' + Math.floor(1000 + Math.random() * 9000),
        timestamp: new Date().toISOString(),
        endpoint: channel === 'Tienda Virtual' ? 'POST /api/v1/storefront/checkout' : 'POST /api/v1/erp/orders',
        source: channel,
        status: '201 Created',
        payload: {
          orderId,
          customerId: customer.id,
          totalUSD: total,
          inventoryUpdated: stockLogs,
          crmSynced: true,
          logisticsAssigned: newOrder.logistics.tracking
        }
      };
      db.apiLogs.unshift(webhookEvent);

      saveDatabase();
      return { order: newOrder, customer, webhookEvent };
    }

    /**
     * Cambio de estado de pedido con reversión automática de inventario y finanzas
     * en caso de Cancelación o Devolución.
     */
    function updateOrderStatus(orderId, newStatus) {
      const order = db.orders.find(o => o.id === orderId);
      if (!order) return;
      const oldStatus = order.status;
      if (oldStatus === newStatus) return;

      const wasActive = !['Cancelado', 'Devuelto'].includes(oldStatus);
      const becomesInactive = ['Cancelado', 'Devuelto'].includes(newStatus);
      const nowDate = todayStr();

      // Si pasa de activo a Cancelado/Devuelto -> Revertir stock y registrar egreso/reverso financiero
      if (wasActive && becomesInactive) {
        order.items.forEach(item => {
          const prod = db.products.find(p => p.id === item.productId);
          if (prod) {
            const prevStock = prod.stock;
            prod.stock += item.qty;
            db.inventoryMovements.unshift({
              id: 'MOV-' + (1001 + db.inventoryMovements.length),
              date: nowDate,
              sku: prod.sku,
              productName: prod.name,
              type: newStatus === 'Devuelto' ? 'Entrada por Devolución' : 'Reverso por Cancelación',
              qty: item.qty,
              prevStock,
              newStock: prod.stock,
              reference: order.id,
              user: currentUser.fullName
            });
          }
        });

        db.financeEntries.unshift({
          id: 'FIN-' + String(db.financeEntries.length + 1).padStart(3, '0'),
          date: nowDate,
          type: 'Egreso',
          category: 'Devoluciones y Reversos',
          description: `Reverso por pedido ${newStatus}: ${order.id} (${order.customerName})`,
          amount: order.total,
          reference: order.id
        });

        const cust = db.customers.find(c => c.id === order.customerId);
        if (cust) {
          cust.interactions.unshift({
            date: nowDate,
            type: `Pedido ${newStatus}`,
            note: `El pedido ${order.id} cambió a estado ${newStatus}. Stock reintegrado.`
          });
        }
      }

      // Sincronizar estado logístico si el pedido se marca Entregado
      if (newStatus === 'Entregado' && order.logistics) {
        order.logistics.dispatchStatus = 'Entregado';
        order.logistics.updatedAt = nowDate;
      } else if (newStatus === 'En Ruta' && order.logistics) {
        order.logistics.dispatchStatus = 'En Tránsito';
        order.logistics.updatedAt = nowDate;
      }

      order.status = newStatus;
      saveDatabase();
      showToast(`Pedido ${orderId} actualizado a "${newStatus}"`, 'success');
      render();
    }

    function getTabTitle(tab) {
      const titles = {
        dashboard: 'Panel Principal Ejecutivo',
        storefront: 'Tienda Virtual AVYRA & API Sync',
        inventory: 'ERP • Productos e Inventario (Kardex)',
        purchases: 'ERP • Compras y Proveedores',
        sales: 'ERP • Ventas y Pedidos',
        finance: 'ERP • Gestión Financiera',
        logistics: 'ERP • Logística Nacional Ecuador',
        customers: 'CRM • Base de Datos de Clientes',
        support: 'CRM • Atención al Cliente y Tickets',
        marketing: 'CRM • Marketing y Fidelización',
        reports: 'Reportes Ejecutivos y Exportación',
        docs: 'Arquitectura de Datos & Manual Operativo'
      };
      return titles[tab] || tab;
    }

    function switchTab(tabId) {
      activeTab = tabId;
      mobileMenuOpen = false;
      render();
    }

    function toggleMobileMenu() {
      mobileMenuOpen = !mobileMenuOpen;
      render();
    }

    function confirmResetDemo() {
      openModal(`
        <div class="p-6">
          <div class="flex items-center gap-3 text-avyra-burgundy mb-3">
            <i data-lucide="alert-triangle" class="w-6 h-6"></i>
            <h3 class="text-lg font-bold text-avyra-navy">Reiniciar Base de Datos de Demostración</h3>
          </div>
          <p class="text-sm text-avyra-slate leading-relaxed">
            Esta acción restaurará el catálogo inicial de <strong>6 productos de AVYRA (210 unidades exactas)</strong> y los registros marcados como <code>[DEMO]</code>. Los cambios temporales realizados en esta sesión se restablecerán.
          </p>
          <div class="mt-6 flex justify-end gap-3">
            <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-avyra-border text-sm font-semibold text-avyra-navy hover:bg-avyra-beige">Cancelar</button>
            <button onclick="closeModal(); resetDemoData();" class="px-4 py-2 rounded-xl bg-avyra-burgundy text-white text-sm font-semibold hover:bg-avyra-burgundyHover">Sí, Reiniciar Datos</button>
          </div>
        </div>
      `, 'max-w-md');
    }

    /**
     * ============================================================================
     * ENRUTADOR DE VISTAS DE MÓDULOS
     * ============================================================================
     */
    function renderActiveModule() {
      switch (activeTab) {
        case 'dashboard': return renderDashboard();
        case 'inventory': return renderInventoryModule();
        case 'purchases': return renderPurchasesModule();
        case 'sales': return renderSalesModule();
        case 'finance': return renderFinanceModule();
        case 'logistics': return renderLogisticsModule();
        case 'customers': return renderCustomersModule();
        case 'support': return renderSupportModule();
        case 'marketing': return renderMarketingModule();
        case 'storefront': return renderStorefrontModule();
        case 'reports': return renderReportsModule();
        case 'docs': return renderDocsModule();
        default: return renderDashboard();
      }
    }

    /**
     * ============================================================================
     * 1. PANEL PRINCIPAL (DASHBOARD DINÁMICO EN TIEMPO REAL)
     * ============================================================================
     */
    function renderDashboard() {
      const today = todayStr();
      const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString().split('T')[0];
      const monthAgo = new Date(Date.now() - 30 * 86400000).toISOString().split('T')[0];

      const validOrders = db.orders.filter(o => !['Cancelado', 'Devuelto'].includes(o.status));
      const salesToday = validOrders.filter(o => o.date === today).reduce((s, o) => s + o.total, 0);
      const salesWeek = validOrders.filter(o => o.date >= weekAgo).reduce((s, o) => s + o.total, 0);
      const salesMonth = validOrders.filter(o => o.date >= monthAgo).reduce((s, o) => s + o.total, 0);

      const pendingOrders = db.orders.filter(o => ['Pendiente', 'Confirmado', 'En Ruta'].includes(o.status)).length;
      const deliveredOrders = db.orders.filter(o => o.status === 'Entregado').length;

      const totalIncome = db.financeEntries.filter(f => f.type === 'Ingreso').reduce((s, f) => s + f.amount, 0);
      const totalExpense = db.financeEntries.filter(f => f.type === 'Egreso').reduce((s, f) => s + f.amount, 0);
      const netProfit = totalIncome - totalExpense;

      const totalCustomers = db.customers.length;
      const newCustomers = db.customers.filter(c => c.segment === 'Nuevo' || c.registeredAt >= weekAgo).length;

      // Top productos más vendidos
      const productSalesMap = {};
      db.products.forEach(p => { productSalesMap[p.sku] = { name: p.name, sku: p.sku, qty: 0, revenue: 0 }; });
      validOrders.forEach(o => {
        o.items.forEach(item => {
          if (!productSalesMap[item.sku]) productSalesMap[item.sku] = { name: item.name, sku: item.sku, qty: 0, revenue: 0 };
          productSalesMap[item.sku].qty += item.qty;
          productSalesMap[item.sku].revenue += item.qty * item.price;
        });
      });
      const topProducts = Object.values(productSalesMap).sort((a, b) => b.qty - a.qty).slice(0, 5);
      const maxSoldQty = Math.max(...topProducts.map(p => p.qty), 1);

      // Alertas de stock bajo (stock <= minStock + 3 para alertas preventivas)
      const lowStockProducts = db.products.filter(p => p.stock <= p.minStock);

      // Datos para gráfico de barras por categoría
      const categoryTotals = {};
      db.products.forEach(p => {
        categoryTotals[p.category] = (categoryTotals[p.category] || 0) + p.stock;
      });
      const catEntries = Object.entries(categoryTotals);
      const maxCatStock = Math.max(...catEntries.map(c => c[1]), 1);

      return `
        <div class="space-y-6">
          <!-- Banner Ejecutivo -->
          <div class="bg-avyra-navy text-white rounded-2xl p-6 flex flex-col md:flex-row md:items-center justify-between gap-4 shadow-sm">
            <div>
              <div class="inline-flex items-center gap-2 text-xs font-semibold text-amber-300 uppercase tracking-wider mb-1">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                Resumen Operativo en Tiempo Real
              </div>
              <h1 class="text-2xl font-bold">Bienvenido al Centro de Control AVYRA</h1>
              <p class="text-sm text-slate-300 mt-1">Todos los indicadores se calculan automáticamente a partir de las operaciones del ERP, CRM y Tienda Virtual.</p>
            </div>
            <div class="flex flex-wrap gap-2">
              ${hasPermission('storefront') ? `
                <button onclick="switchTab('storefront')" class="px-4 py-2.5 rounded-xl bg-avyra-burgundy hover:bg-avyra-burgundyHover text-white text-xs font-bold flex items-center gap-2 shadow">
                  <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                  Probar Tienda Online
                </button>
              ` : ''}
              ${hasPermission('sales') ? `
                <button onclick="openNewOrderModal()" class="px-4 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs font-bold flex items-center gap-2">
                  <i data-lucide="plus-circle" class="w-4 h-4"></i>
                  Registrar Venta
                </button>
              ` : ''}
            </div>
          </div>

          <!-- KPI Grid Principal -->
          <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
            <!-- Ventas Hoy / Semana / Mes -->
            <div class="bg-white p-5 rounded-2xl border border-avyra-border shadow-2xs">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold uppercase tracking-wider text-avyra-slate">Ventas del Mes</span>
                <div class="w-9 h-9 rounded-xl bg-avyra-burgundy/10 text-avyra-burgundy flex items-center justify-center">
                  <i data-lucide="trending-up" class="w-5 h-5"></i>
                </div>
              </div>
              <div class="text-2xl font-extrabold text-avyra-navy mt-2">${fmtMoney(salesMonth)}</div>
              <div class="mt-3 pt-2.5 border-t border-avyra-border flex items-center justify-between text-xs text-avyra-slate">
                <span>Hoy: <strong class="text-avyra-navy">${fmtMoney(salesToday)}</strong></span>
                <span>Semana: <strong class="text-avyra-navy">${fmtMoney(salesWeek)}</strong></span>
              </div>
            </div>

            <!-- Pedidos -->
            <div class="bg-white p-5 rounded-2xl border border-avyra-border shadow-2xs">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold uppercase tracking-wider text-avyra-slate">Pedidos Totales</span>
                <div class="w-9 h-9 rounded-xl bg-avyra-navy/10 text-avyra-navy flex items-center justify-center">
                  <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                </div>
              </div>
              <div class="text-2xl font-extrabold text-avyra-navy mt-2">${db.orders.length} <span class="text-xs font-normal text-avyra-slate">órdenes</span></div>
              <div class="mt-3 pt-2.5 border-t border-avyra-border flex items-center justify-between text-xs">
                <span class="text-amber-700 font-semibold">En curso: ${pendingOrders}</span>
                <span class="text-emerald-700 font-semibold">Entregados: ${deliveredOrders}</span>
              </div>
            </div>

            <!-- Ingresos vs Gastos -->
            <div class="bg-white p-5 rounded-2xl border border-avyra-border shadow-2xs">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold uppercase tracking-wider text-avyra-slate">Balance Financiero</span>
                <div class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-700 flex items-center justify-center">
                  <i data-lucide="dollar-sign" class="w-5 h-5"></i>
                </div>
              </div>
              <div class="text-2xl font-extrabold ${netProfit >= 0 ? 'text-emerald-700' : 'text-avyra-burgundy'} mt-2">${fmtMoney(netProfit)}</div>
              <div class="mt-3 pt-2.5 border-t border-avyra-border flex items-center justify-between text-xs">
                <span class="text-emerald-700">Ing: <strong>${fmtMoney(totalIncome)}</strong></span>
                <span class="text-avyra-burgundy">Egr: <strong>${fmtMoney(totalExpense)}</strong></span>
              </div>
            </div>

            <!-- Clientes CRM -->
            <div class="bg-white p-5 rounded-2xl border border-avyra-border shadow-2xs">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold uppercase tracking-wider text-avyra-slate">Comunidad CRM</span>
                <div class="w-9 h-9 rounded-xl bg-sky-50 text-sky-700 flex items-center justify-center">
                  <i data-lucide="users" class="w-5 h-5"></i>
                </div>
              </div>
              <div class="text-2xl font-extrabold text-avyra-navy mt-2">${totalCustomers} <span class="text-xs font-normal text-avyra-slate">clientes</span></div>
              <div class="mt-3 pt-2.5 border-t border-avyra-border flex items-center justify-between text-xs">
                <span class="text-sky-700 font-semibold">Nuevos: +${newCustomers}</span>
                <span class="text-avyra-slate">Tickets abiertos: ${db.tickets.filter(t => t.status !== 'Resuelto').length}</span>
              </div>
            </div>
          </div>

          <!-- Fila de Gráficos y Top Productos -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Gráfico Comparativo de Stock por Categoría -->
            <div class="lg:col-span-7 bg-white p-6 rounded-2xl border border-avyra-border shadow-2xs">
              <div class="flex items-center justify-between mb-4">
                <div>
                  <h3 class="font-bold text-avyra-navy">Distribución de Inventario por Categoría</h3>
                  <p class="text-xs text-avyra-slate">Unidades disponibles en bodega AVYRA Ecuador</p>
                </div>
                <span class="px-2.5 py-1 rounded-lg bg-avyra-beige text-xs font-bold text-avyra-navy">
                  Total: ${db.products.reduce((s, p) => s + p.stock, 0)} uds
                </span>
              </div>
              <div class="space-y-3.5 mt-4">
                ${catEntries.map(([cat, qty]) => {
                  const pct = Math.round((qty / maxCatStock) * 100);
                  return `
                    <div>
                      <div class="flex justify-between text-xs font-semibold mb-1">
                        <span class="text-avyra-navy">${cat}</span>
                        <span class="text-avyra-slate">${qty} unidades</span>
                      </div>
                      <div class="w-full h-3 bg-avyra-beige rounded-full overflow-hidden">
                        <div class="h-full bg-avyra-navy rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>

              <!-- Resumen Financiero Visual -->
              <div class="mt-6 pt-5 border-t border-avyra-border grid grid-cols-3 gap-3 text-center">
                <div class="p-3 rounded-xl bg-avyra-beige/60">
                  <div class="text-[11px] text-avyra-slate">Ingresos Brutos</div>
                  <div class="text-sm font-extrabold text-emerald-700 mt-0.5">${fmtMoney(totalIncome)}</div>
                </div>
                <div class="p-3 rounded-xl bg-avyra-beige/60">
                  <div class="text-[11px] text-avyra-slate">Gastos Operativos</div>
                  <div class="text-sm font-extrabold text-avyra-burgundy mt-0.5">${fmtMoney(totalExpense)}</div>
                </div>
                <div class="p-3 rounded-xl bg-avyra-beige/60">
                  <div class="text-[11px] text-avyra-slate">Ticket Promedio</div>
                  <div class="text-sm font-extrabold text-avyra-navy mt-0.5">${fmtMoney(validOrders.length ? salesMonth / validOrders.length : 0)}</div>
                </div>
              </div>
            </div>

            <!-- Productos Más Vendidos -->
            <div class="lg:col-span-5 bg-white p-6 rounded-2xl border border-avyra-border shadow-2xs">
              <h3 class="font-bold text-avyra-navy">Productos Más Vendidos</h3>
              <p class="text-xs text-avyra-slate mb-4">Ranking sincronizado con pedidos confirmados</p>
              <div class="space-y-3.5">
                ${topProducts.map((p, idx) => {
                  const barPct = p.qty > 0 ? Math.max(12, Math.round((p.qty / maxSoldQty) * 100)) : 5;
                  return `
                    <div class="p-3 rounded-xl border border-avyra-border/70 bg-avyra-beige/30">
                      <div class="flex items-center justify-between text-xs font-bold">
                        <span class="text-avyra-navy truncate pr-2">${idx + 1}. ${p.name}</span>
                        <span class="text-avyra-burgundy shrink-0">${p.qty} vend.</span>
                      </div>
                      <div class="flex items-center justify-between text-[11px] text-avyra-slate mt-1">
                        <span class="font-mono">${p.sku}</span>
                        <span>Facturado: ${fmtMoney(p.revenue)}</span>
                      </div>
                      <div class="w-full h-1.5 bg-avyra-border rounded-full mt-2 overflow-hidden">
                        <div class="h-full bg-avyra-burgundy rounded-full" style="width: ${barPct}%"></div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>

          <!-- Alertas de Inventario Mínimo y Actividad Reciente -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Alertas de Stock -->
            <div class="bg-white p-6 rounded-2xl border border-avyra-border shadow-2xs">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-avyra-navy flex items-center gap-2">
                  <i data-lucide="alert-circle" class="w-5 h-5 text-avyra-burgundy"></i>
                  Alertas de Inventario Mínimo
                </h3>
                <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${lowStockProducts.length ? 'bg-red-100 text-avyra-burgundy' : 'bg-emerald-100 text-emerald-800'}">
                  ${lowStockProducts.length} alerta(s)
                </span>
              </div>
              ${lowStockProducts.length === 0 ? `
                <div class="p-6 text-center rounded-xl bg-emerald-50/70 border border-emerald-200 text-emerald-800 text-sm">
                  Todos los productos superan su umbral de stock mínimo configurado.
                </div>
              ` : `
                <div class="space-y-2.5">
                  ${lowStockProducts.map(p => `
                    <div class="flex items-center justify-between p-3 rounded-xl bg-red-50 border border-red-200">
                      <div>
                        <div class="text-xs font-bold text-avyra-burgundy">${p.sku} — ${p.name}</div>
                        <div class="text-[11px] text-slate-600">Stock actual: <strong>${p.stock} uds</strong> (Mínimo requerido: ${p.minStock})</div>
                      </div>
                      ${hasPermission('purchases') ? `
                        <button onclick="switchTab('purchases')" class="px-3 py-1.5 rounded-lg bg-avyra-burgundy text-white text-xs font-semibold hover:bg-avyra-burgundyHover">
                          Reabastecer
                        </button>
                      ` : ''}
                    </div>
                  `).join('')}
                </div>
              `}
            </div>

            <!-- Notificaciones Recientes del Sistema -->
            <div class="bg-white p-6 rounded-2xl border border-avyra-border shadow-2xs">
              <h3 class="font-bold text-avyra-navy flex items-center gap-2 mb-4">
                <i data-lucide="bell" class="w-5 h-5 text-avyra-navy"></i>
                Bitácora de Sincronización & Movimientos
              </h3>
              <div class="space-y-2.5 max-h-64 overflow-y-auto pr-1">
                ${db.inventoryMovements.slice(0, 6).map(m => `
                  <div class="flex items-start justify-between p-2.5 rounded-xl bg-avyra-beige/50 border border-avyra-border/60 text-xs">
                    <div>
                      <span class="font-bold text-avyra-navy">${m.type}:</span>
                      <span class="text-slate-700">${m.productName} (${m.qty > 0 ? '+' + m.qty : m.qty} uds)</span>
                      <div class="text-[11px] text-avyra-slate mt-0.5">Ref: ${m.reference} • ${m.date}</div>
                    </div>
                    <span class="font-mono text-[11px] px-2 py-0.5 rounded bg-white border border-avyra-border text-avyra-navy">
                      Stock: ${m.newStock}
                    </span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    /**
     * ============================================================================
     * 2A. MÓDULO ERP – GESTIÓN DE PRODUCTOS E INVENTARIO (KARDEX)
     * ============================================================================
     */
    function renderInventoryModule() {
      const categories = ['Todas', ...new Set(db.products.map(p => p.category))];
      const filtered = db.products.filter(p => {
        const matchSearch = p.name.toLowerCase().includes(filters.inventorySearch.toLowerCase()) ||
                            p.sku.toLowerCase().includes(filters.inventorySearch.toLowerCase()) ||
                            p.variant.toLowerCase().includes(filters.inventorySearch.toLowerCase());
        const matchCat = filters.inventoryCategory === 'Todas' || p.category === filters.inventoryCategory;
        return matchSearch && matchCat;
      });

      const totalStock = db.products.reduce((s, p) => s + p.stock, 0);
      const totalValuation = db.products.reduce((s, p) => s + (p.stock * p.cost), 0);

      return `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 class="text-xl font-extrabold text-avyra-navy">Productos, Variantes e Inventario</h2>
              <p class="text-xs text-avyra-slate">Control de existencias por SKU, valoración de bodega y Kardex automático.</p>
            </div>
            <div class="flex flex-wrap gap-2">
              <button onclick="openStockAdjustmentModal()" class="px-4 py-2.5 rounded-xl border border-avyra-navy text-avyra-navy hover:bg-avyra-navy hover:text-white text-xs font-bold flex items-center gap-2 transition">
                <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
                Entrada / Salida Manual
              </button>
              <button onclick="openProductFormModal()" class="px-4 py-2.5 rounded-xl bg-avyra-burgundy hover:bg-avyra-burgundyHover text-white text-xs font-bold flex items-center gap-2 shadow-sm transition">
                <i data-lucide="plus" class="w-4 h-4"></i>
                Nuevo Producto / SKU
              </button>
            </div>
          </div>

          <!-- Resumen rápido de bodega -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-2xl border border-avyra-border">
              <div class="text-xs text-avyra-slate font-semibold">Total Unidades Físicas</div>
              <div class="text-2xl font-extrabold text-avyra-navy mt-1">${totalStock} uds</div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-avyra-border">
              <div class="text-xs text-avyra-slate font-semibold">Valoración Inventario (Costo)</div>
              <div class="text-2xl font-extrabold text-avyra-navy mt-1">${fmtMoney(totalValuation)}</div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-avyra-border">
              <div class="text-xs text-avyra-slate font-semibold">SKUs Activos</div>
              <div class="text-2xl font-extrabold text-avyra-burgundy mt-1">${db.products.filter(p => p.active).length} / ${db.products.length}</div>
            </div>
          </div>

          <!-- Filtros -->
          <div class="bg-white p-4 rounded-2xl border border-avyra-border flex flex-col sm:flex-row gap-3">
            <div class="flex-1 relative">
              <i data-lucide="search" class="w-4 h-4 text-avyra-slate absolute left-3.5 top-3"></i>
              <input type="text" placeholder="Buscar por SKU (ej. AVY-001), nombre o variante..."
                value="${filters.inventorySearch}"
                oninput="filters.inventorySearch = this.value; render();"
                class="w-full pl-10 pr-4 py-2 rounded-xl border border-avyra-border text-sm focus:outline-none focus:ring-2 focus:ring-avyra-burgundy" />
            </div>
            <select onchange="filters.inventoryCategory = this.value; render();"
              class="px-3.5 py-2 rounded-xl border border-avyra-border text-sm font-medium bg-avyra-beige/40">
              ${categories.map(c => `<option value="${c}" ${filters.inventoryCategory === c ? 'selected' : ''}>Categoría: ${c}</option>`).join('')}
            </select>
          </div>

          <!-- Tabla de Productos -->
          <div class="bg-white rounded-2xl border border-avyra-border overflow-hidden shadow-2xs">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-avyra-navy text-white text-[11px] uppercase tracking-wider">
                    <th class="py-3.5 px-4">SKU</th>
                    <th class="py-3.5 px-4">Producto & Variante</th>
                    <th class="py-3.5 px-4">Categoría</th>
                    <th class="py-3.5 px-4 text-right">Costo</th>
                    <th class="py-3.5 px-4 text-right">PVP (Sin IVA)</th>
                    <th class="py-3.5 px-4 text-center">Stock</th>
                    <th class="py-3.5 px-4 text-center">Estado</th>
                    <th class="py-3.5 px-4 text-right">Acciones</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-avyra-border text-sm">
                  ${filtered.map(p => {
                    const isLow = p.stock <= p.minStock;
                    return `
                      <tr class="hover:bg-avyra-beige/40 transition">
                        <td class="py-3.5 px-4 font-mono text-xs font-bold text-avyra-navy">${p.sku}</td>
                        <td class="py-3.5 px-4">
                          <div class="font-bold text-avyra-navy">${p.name}</div>
                          <div class="text-xs text-avyra-slate">${p.variant}</div>

                        <td class="py-3.5 px-4">

    function saveProductForm(e, productId) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const sku = fd.get('sku').trim().toUpperCase();
      const data = {
        sku,
        name: fd.get('name').trim(),
        category: fd.get('category'),
        variant: fd.get('variant').trim(),
        description: fd.get('description').trim(),
        cost: parseFloat(fd.get('cost')),
        price: parseFloat(fd.get('price')),
        minStock: parseInt(fd.get('minStock'), 10),
        active: fd.get('active') === 'on'
      };

      if (productId) {
        const prod = db.products.find(p => p.id === productId);
        Object.assign(prod, data);
        showToast(`Producto ${sku} actualizado y sincronizado con Tienda Virtual.`, 'success');
      } else {
        if (db.products.some(p => p.sku === sku)) {
          showToast(`El SKU ${sku} ya existe en el catálogo.`, 'error');
          return;
        }
        const initialStock = parseInt(fd.get('stock'), 10);
        const newProd = {
          id: 'PRD-' + String(db.products.length + 1).padStart(3, '0'),
          ...data,
          stock: initialStock,
          icon: 'package'
        };
        db.products.push(newProd);
        db.inventoryMovements.unshift({
          id: 'MOV-' + (1001 + db.inventoryMovements.length),
          date: todayStr(),
          sku: newProd.sku,
          productName: newProd.name,
          type: 'Alta de Producto',
          qty: initialStock,
          prevStock: 0,
          newStock: initialStock,
          reference: 'ALTA-ERP',
          user: currentUser.fullName
        });
        showToast(`Nuevo producto ${newProd.name} (${sku}) registrado.`, 'success');
      }

      saveDatabase();
      closeModal();
      render();
    }

    function deleteProduct(productId) {
      const prod = db.products.find(p => p.id === productId);
      if (!prod) return;
      db.products = db.products.filter(p => p.id !== productId);
      saveDatabase();
      showToast(`Producto ${prod.sku} eliminado del catálogo.`, 'warning');
      render();
    }

    function processStockAdjustment(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const prod = db.products.find(p => p.id === fd.get('productId'));
      const moveType = fd.get('moveType');
      const qty = parseInt(fd.get('qty'), 10);
      const ref = fd.get('reference').trim();

      if (moveType === 'out' && prod.stock < qty) {
        showToast('No puedes descontar más unidades del stock disponible.', 'error');
        return;
      }

      const prevStock = prod.stock;
      const delta = moveType === 'in' ? qty : -qty;
      prod.stock += delta;

      db.inventoryMovements.unshift({
        id: 'MOV-' + (1001 + db.inventoryMovements.length),
        date: todayStr(),
        sku: prod.sku,
        productName: prod.name,
        type: moveType === 'in' ? 'Entrada Manual' : 'Salida Manual',
        qty: delta,
        prevStock,
        newStock: prod.stock,
        reference: ref,
        user: currentUser.fullName
      });

      saveDatabase();
      closeModal();
      showToast(`Kardex actualizado: ${prod.sku} ahora tiene ${prod.stock} unidades.`, 'success');
      render();
    }

    function createPurchaseOrder(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const supplier = db.suppliers.find(s => s.id === fd.get('supplierId'));
      const prod = db.products.find(p => p.id === fd.get('productId'));
      const qty = parseInt(fd.get('qty'), 10);
      const unitCost = parseFloat(fd.get('unitCost'));
      const status = fd.get('status');

      const ocId = 'OC-2026-' + String(db.purchaseOrders.length + 1).padStart(3, '0');
      const total = Number((qty * unitCost).toFixed(2));

      db.purchaseOrders.unshift({
        id: ocId,
        date: todayStr(),
        supplierId: supplier.id,
        supplierName: supplier.name,
        items: [{ productId: prod.id, sku: prod.sku, name: prod.name, qty, unitCost }],
        total,
        status: 'Pendiente',
        receivedDate: null
      });

      if (status === 'Recibida') {
        receivePurchaseOrder(ocId, false);
      } else {
        saveDatabase();
        showToast(`Orden ${ocId} emitida en estado Pendiente.`, 'info');
      }
      closeModal();
      render();
    }

    function receivePurchaseOrder(ocId, shouldRender = true) {
      const oc = db.purchaseOrders.find(o => o.id === ocId);
      if (!oc || oc.status === 'Recibida') return;
      const nowDate = todayStr();

      oc.status = 'Recibida';
      oc.receivedDate = nowDate;

      // Incrementar stock automáticamente y registrar Kardex
      oc.items.forEach(item => {
        const prod = db.products.find(p => p.id === item.productId);
        if (prod) {
          const prevStock = prod.stock;
          prod.stock += item.qty;
          prod.cost = item.unitCost;
          db.inventoryMovements.unshift({
            id: 'MOV-' + (1001 + db.inventoryMovements.length),
            date: nowDate,
            sku: prod.sku,
            productName: prod.name,
            type: 'Entrada por Compra',
            qty: item.qty,
            prevStock,
            newStock: prod.stock,
            reference: oc.id,
            user: currentUser.fullName
          });
        }
      });

      // Registrar egreso en Finanzas
      db.financeEntries.unshift({
        id: 'FIN-' + String(db.financeEntries.length + 1).padStart(3, '0'),
        date: nowDate,
        type: 'Egreso',
        category: 'Compras de Mercadería',
        description: `Pago recepción ${oc.id} - ${oc.supplierName}`,
        amount: oc.total,
        reference: oc.id
      });

      saveDatabase();
      showToast(`Mercancía recibida (${oc.id}): inventario y finanzas actualizados.`, 'success');
      if (shouldRender) render();
    }

      const qty = parseInt(fd.get('qty'), 10);

      try {
        const res = processIntegratedOrder({
          channel: 'Venta Directa ERP',
          customerData: cust,
          items: [{ productId: prod.id, sku: prod.sku, name: prod.name, qty, price: prod.price }],
          paymentMethod: fd.get('paymentMethod'),
          discountCode: fd.get('discountCode')

        showToast(err.message, 'error');

    function updateShipmentDetails(orderId, field, value) {
      const order = db.orders.find(o => o.id === orderId);
      if (!order) return;
      order.logistics[field] = value;
      order.logistics.updatedAt = todayStr();

      if (field === 'dispatchStatus') {
        if (value === 'Entregado') order.status = 'Entregado';
        else if (value === 'En Tránsito' || value === 'Despachado') order.status = 'En Ruta';
      }

      saveDatabase();
      showToast(`Guía logística de ${orderId} actualizada.`, 'success');
      render();
    }

    function saveNewCustomer(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      db.customers.unshift({
        id: 'CLI-' + String(db.customers.length + 1).padStart(3, '0'),
        firstName: fd.get('firstName').trim(),
        lastName: fd.get('lastName').trim(),
        email: fd.get('email').trim(),
        phone: fd.get('phone').trim(),
        province: fd.get('province'),
        city: fd.get('city').trim(),
        address: fd.get('address').trim(),
        registeredAt: todayStr(),
        segment: fd.get('segment'),
        preferences: fd.get('preferences').trim() || 'General',
        marketingConsent: fd.get('marketingConsent') === 'on',
        interactions: [{ date: todayStr(), type: 'Alta Manual CRM', note: 'Registrado por equipo comercial.' }]
      });
      saveDatabase();
      closeModal();
      showToast('Cliente registrado en CRM.', 'success');
      render();

    function dispatchCampaignWithConsent(campId) {
      const camp = db.campaigns.find(c => c.id === campId);
      if (!camp) return;
      const eligible = db.customers.filter(c =>
        c.marketingConsent && (camp.targetSegment === 'Todos' || c.segment === camp.targetSegment)
      );
      if (eligible.length === 0) {
        showToast('No hay clientes con consentimiento autorizado en ese segmento.', 'warning');
        return;
      }
      camp.sentCount += eligible.length;
      eligible.forEach(c => {
        c.interactions.unshift({
          date: todayStr(),
          type: 'Campaña Marketing',
          note: `Enviada promoción "${camp.name}" (Cupón ${camp.code}) con consentimiento verificado.`
        });
      });
      saveDatabase();
      showToast(`Campaña enviada a ${eligible.length} cliente(s) con autorización verificada.`, 'success');
      render();
    }

    function addToStoreCart(productId) {
      const prod = db.products.find(p => p.id === productId);
      if (!prod || prod.stock <= 0) return;
      const existing = cart.find(i => i.productId === productId);
      if (existing) {
        if (existing.qty >= prod.stock) {
          showToast(`Stock máximo disponible alcanzado (${prod.stock} uds).`, 'warning');
          return;
        }
        existing.qty += 1;
      } else {
        cart.push({ productId: prod.id, sku: prod.sku, name: prod.name, price: prod.price, qty: 1 });
      }
      render();
    }

    function removeFromStoreCart(productId) {
      cart = cart.filter(i => i.productId !== productId);
      render();
    }

    function submitStoreCheckout(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        const result = processIntegratedOrder({
          channel: 'Tienda Virtual',
          customerData: {
            firstName: fd.get('firstName').trim(),
            lastName: fd.get('lastName').trim(),
            email: fd.get('email').trim(),
            phone: fd.get('phone').trim(),
            province: fd.get('province'),
            city: fd.get('city').trim(),
            address: fd.get('address').trim(),
            marketingConsent: fd.get('marketingConsent') === 'on'
          },
          items: cart,
          paymentMethod: 'Pasarela Web AVYRA (Tarjeta)',
          discountCode: fd.get('discountCode')
        });
        cart = [];
        showToast(`¡Compra ${result.order.id} procesada! Sincronizada con ERP, CRM, Inventario y Logística.`, 'success');
        render();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function exportCSV(dataset) {
      let headers = [];
      let rows = [];
      let filename = `AVYRA_${dataset}_${todayStr()}.csv`;

      if (dataset === 'ventas') {
        headers = ['ID_Pedido', 'Fecha', 'Canal', 'Cliente', 'Ciudad', 'Provincia', 'Subtotal', 'IVA', 'Total', 'Estado'];
        rows = db.orders.map(o => [o.id, o.date, o.channel, o.customerName, o.city, o.province, o.subtotal, o.iva, o.total, o.status]);
      } else if (dataset === 'inventario') {
        headers = ['SKU', 'Producto', 'Categoria', 'Variante', 'Costo_USD', 'Precio_Venta_USD', 'Stock_Actual', 'Stock_Minimo'];
        rows = db.products.map(p => [p.sku, p.name, p.category, p.variant, p.cost, p.price, p.stock, p.minStock]);
      } else if (dataset === 'clientes') {
        headers = ['ID', 'Nombre', 'Apellido', 'Email', 'Telefono', 'Ciudad', 'Provincia', 'Clasificacion', 'Consentimiento_Marketing'];
        rows = db.customers.map(c => [c.id, c.firstName, c.lastName, c.email, c.phone, c.city, c.province, c.segment, c.marketingConsent ? 'SI' : 'NO']);
      } else if (dataset === 'finanzas') {
        headers = ['ID', 'Fecha', 'Tipo', 'Categoria', 'Descripcion', 'Monto_USD', 'Referencia'];
        rows = db.financeEntries.map(f => [f.id, f.date, f.type, f.category, f.description, f.amount, f.reference]);
      }

      const csvContent = '\uFEFF' + [headers, ...rows]
        .map(r => r.map(cell => `"${String(cell ?? '').replace(/"/g, '""')}"`).join(','))
        .join('\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
      showToast(`Archivo ${filename} descargado correctamente.`, 'success');
    }
